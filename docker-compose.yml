services:
  db:
    image: postgres:16
    container_name: mineguard_db
    restart: always
    environment:
      POSTGRES_USER: mineguard
      POSTGRES_PASSWORD: mineguard_dev_pw
      POSTGRES_DB: mineguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
